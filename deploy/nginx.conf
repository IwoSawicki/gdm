# Staging (gdm.stolz-marketing.de) darf nie in den Index — über den
# Host-Header, damit der Build für alle Umgebungen identisch bleibt.
map $host $robots_tag {
  default                 "";
  gdm.stolz-marketing.de  "noindex, nofollow";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Absolute Weiterleitungen sonst mit internem Port/Host
  absolute_redirect off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml text/xml;
  gzip_min_length 512;

  # add_header vererbt sich nicht in location-Blöcke mit eigenem
  # add_header — X-Robots-Tag deshalb in jedem Block wiederholen.
  add_header X-Robots-Tag $robots_tag always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  error_page 404 /404.html;

  # Alte Adressen der WordPress-Seite (Relaunch). Regex mit ~* und /?$,
  # damit Schrägstrich am Ende und Großschreibung mit abgedeckt sind.
  # www → ohne www (eine Domain, ein Inhalt). TLS endet vor nginx (Dokploy/Traefik).
  if ($host = www.service-gdm.de) {
    return 301 https://service-gdm.de$request_uri;
  }

  # ---- Alte Adressen der WordPress-Seite (Relaunch 2026) ----------------
  # Regex mit ~* und /?$: fängt Großschreibung mit ab.
  # 301 = endgültig. 302 = vorläufig, weil dort später eine eigene Seite
  # entsteht (sonst merken sich Browser die Umleitung dauerhaft).
  location ~* ^/hausmeisterdienste/?$     { return 301 /hausmeisterservice; }
  location ~* ^/winterdienste/?$          { return 301 /winterdienst; }
  location ~* ^/datenschutzerklaerung/?$  { return 301 /datenschutz; }
  location ~* ^/(management|service)/?$   { return 301 /gebaeudereinigung; }
  location ~* ^/(hotelreinigung|gruenanlagenpflege|waschraumloesungen)/?$ { return 302 /gebaeudereinigung; }
  location ~* ^/(sonderreinigung|fassadenreinigung|entruempelung|montage)/?$ { return 302 /baureinigung#sonderreinigung; }
  location ~* ^/ueber-uns/?$              { return 302 /#warum; }
  location ~* ^/kontakt/?$                { return 302 /#anfrage; }
  location ~* ^/category/                 { return 301 /; }
  # Sitemaps der alten Seite (Yoast/WordPress) — stehen ggf. noch in der Search Console
  location ~* ^/(sitemap_index|sitemap|wp-sitemap|post-sitemap|page-sitemap|category-sitemap)\.xml$ { return 301 /sitemap-index.xml; }
  # Demo-Artikel des WordPress-Themes (Autopflege) — gibt es nicht mehr
  location ~* ^/(hello-world|welcome-to-self-cleaning-car|good-tips-for-cleaning-your-car|am-i-washing-my-vehicle-properly|tire-maintenance-for-beginners|bad-driving-habits-for-your-engine|the-effect-of-bigger-tires-on-your-car|diesel-vs-gasoline-which-is-better)/?$ { return 410; }
  # WordPress-Pfade (Bilder, Login, Feeds) — gibt es nicht mehr
  location ~* ^/(wp-content|wp-includes|wp-admin|wp-login\.php|xmlrpc\.php|feed)(/|$) { return 410; }

  location / {
    # Alte Adressen kamen mit Schrägstrich am Ende (/unterhaltsreinigung/).
    # Eine Adresse, ein Inhalt: auf die Fassung ohne Schrägstrich. Steht hier
    # (nicht auf Server-Ebene), damit die Regex-Umleitungen oben zuerst
    # greifen und alte Adressen in EINEM Schritt am Ziel ankommen.
    rewrite ^/(.+)/$ /$1 permanent;
    # passt zu trailingSlash: 'never'
    try_files $uri $uri/index.html $uri/ =404;
  }

  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Robots-Tag $robots_tag always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location /fonts/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Robots-Tag $robots_tag always;
    add_header X-Content-Type-Options "nosniff" always;
  }
}
