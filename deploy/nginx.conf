# Staging (gdm.stolz-marketing.de) darf nie in den Index — über den
# Host-Header, damit der Build für alle Umgebungen identisch bleibt.
map $host $robots_tag {
  default                 "";
  gdm.stolz-marketing.de  "noindex, nofollow";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Absolute Weiterleitungen sonst mit internem Port/Host
  absolute_redirect off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml text/xml;
  gzip_min_length 512;

  # add_header vererbt sich nicht in location-Blöcke mit eigenem
  # add_header — X-Robots-Tag deshalb in jedem Block wiederholen.
  add_header X-Robots-Tag $robots_tag always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  error_page 404 /404.html;

  # Alte Adressen der WordPress-Seite (Relaunch). Regex mit ~* und /?$,
  # damit Schrägstrich am Ende und Großschreibung mit abgedeckt sind.
  # Alte Adressen kamen mit Schrägstrich am Ende (/unterhaltsreinigung/).
  # Eine Adresse, ein Inhalt: auf die Fassung ohne Schrägstrich umleiten.
  rewrite ^/(.+)/$ /$1 permanent;

  location ~* ^/hausmeisterdienste/?$ { return 301 /hausmeisterservice; }
  location ~* ^/winterdienste/?$      { return 301 /winterdienst; }

  location / {
    # passt zu trailingSlash: 'never'
    try_files $uri $uri/index.html $uri/ =404;
  }

  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Robots-Tag $robots_tag always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location /fonts/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Robots-Tag $robots_tag always;
    add_header X-Content-Type-Options "nosniff" always;
  }
}
